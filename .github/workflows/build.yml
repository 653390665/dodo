name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify DMG
        run: |
          DMG=$(ls release/InkFlow-*-mac-arm64.dmg)
          SIZE=$(stat -f%z "$DMG")
          echo "DMG: $DMG ($SIZE bytes)"
          if [ "$SIZE" -lt 50000000 ]; then echo "DMG too small, build likely failed"; exit 1; fi
          # Mount and verify contents
          hdiutil attach "$DMG" -mountpoint /tmp/inkflow-mnt -nobrowse -quiet
          ls -la /tmp/inkflow-mnt/
          hdiutil detach /tmp/inkflow-mnt -quiet
          echo "DMG verification OK"
      - uses: actions/upload-artifact@v4
        with:
          name: InkFlow-mac-arm64
          path: release/InkFlow-*-mac-*.dmg

  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx --test tests/electron-startup-contract.test.ts
      - run: npx electron-builder install-app-deps
      - run: npm run package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify server.cjs has no unbundled runtime deps
        shell: pwsh
        run: |
          $server = Get-Content dist-electron/server.cjs -Raw
          $extReqs = [regex]::Matches($server, 'require\("([^"]+)"\)') | ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique
          $bad = @($extReqs | Where-Object { $_ -eq 'vite' -or $_ -eq 'express' -or $_ -eq 'tsx' })
          if ($bad.Count -gt 0) {
            Write-Error "server.cjs has bare external requires: $($bad -join ', ')"
            exit 1
          }
          Write-Host "OK: $($extReqs.Count) unique external requires, none are vite/express/tsx"
      - name: Verify packaged ZIP contents
        shell: pwsh
        run: |
          $zip = Get-ChildItem release/InkFlow-*-win-x64.zip | Select-Object -First 1
          Write-Host "ZIP: $($zip.Name) ($($zip.Length) bytes)"
          Expand-Archive -Path $zip.FullName -DestinationPath release/verify-win-zip -Force
          $base = "release/verify-win-zip"
          $pkgDir = Get-ChildItem "$base/resources/app.asar.unpacked" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $pkgDir) { Write-Error "app.asar.unpacked missing"; exit 1 }
          Write-Host "app.asar.unpacked found: $($pkgDir.FullName)"
          $serverPath = "$($pkgDir.FullName)/dist-electron/server.cjs"
          if (-not (Test-Path $serverPath)) { Write-Error "server.cjs missing from package"; exit 1 }
          $shimPath = "$($pkgDir.FullName)/dist-electron/better-sqlite3-shim.cjs"
          if (-not (Test-Path $shimPath)) { Write-Error "shim missing from package"; exit 1 }
          Write-Host "All required files present"
          $pkgServer = Get-Content $serverPath -Raw -ErrorAction Stop
          $pkgReqs = [regex]::Matches($pkgServer, 'require\("([^"]+)"\)') | ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique
          $pkgBad = @($pkgReqs | Where-Object { $_ -eq 'vite' -or $_ -eq 'express' -or $_ -eq 'tsx' })
          if ($pkgBad.Count -gt 0) {
            Write-Error "packaged server.cjs has bare requires: $($pkgBad -join ', ')"
            exit 1
          }
          Write-Host "packaged server.cjs OK ($($pkgReqs.Count) unique requires)"
      - name: Verify EXE
        shell: pwsh
        run: |
          $exe = Get-ChildItem release/InkFlow-*-win-x64.exe | Select-Object -First 1
          $size = (Get-Item $exe).Length
          Write-Host "EXE: $exe ($size bytes)"
          if ($size -lt 50000000) { Write-Error "EXE too small, build likely failed"; exit 1 }
          Write-Host "EXE verification OK"
          $zip = Get-ChildItem release/InkFlow-*-win-x64.zip | Select-Object -First 1
          if ($zip) { Write-Host "ZIP: $zip ($((Get-Item $zip).Length) bytes)" }
      - name: Real startup smoke with Electron runtime
        shell: pwsh
        run: |
          $unpacked = Get-ChildItem release/win-unpacked -Directory | Select-Object -First 1
          if (-not $unpacked) { Write-Error "release/win-unpacked not found"; exit 1 }
          $serverJs = Join-Path $unpacked.FullName "resources/app.asar.unpacked/dist-electron/server.cjs"
          $env:ELECTRON_RUN_AS_NODE = "1"
          $env:NODE_ENV = "production"
          $env:PORT = "3099"
          $proc = Start-Process -NoNewWindow -PassThru -FilePath "$($unpacked.FullName)/InkFlow.exe" -ArgumentList $serverJs -RedirectStandardOutput "release/smoke-stdout.txt" -RedirectStandardError "release/smoke-stderr.txt"
          Start-Sleep -Seconds 10
          if ($proc.HasExited) {
            Write-Error "Server crashed on startup. stderr:"
            Get-Content release/smoke-stderr.txt -ErrorAction SilentlyContinue | Write-Host
            exit 1
          }
          try {
            $config = Invoke-RestMethod -Uri "http://localhost:3099/api/config" -TimeoutSec 5
            if (-not $config.hasApiKey) { throw "hasApiKey missing" }
            Write-Host "SMOKE PASSED: hasApiKey=$($config.hasApiKey) model=$($config.model)"
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v4
        with:
          name: InkFlow-win-x64
          path: |
            release/InkFlow-*-win-*.exe
            release/InkFlow-*-win-*.zip

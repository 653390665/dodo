name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify DMG
        run: |
          DMG=$(ls release/InkFlow-*-mac-arm64.dmg)
          SIZE=$(stat -f%z "$DMG")
          echo "DMG: $DMG ($SIZE bytes)"
          if [ "$SIZE" -lt 50000000 ]; then echo "DMG too small, build likely failed"; exit 1; fi
          # Mount and verify contents
          hdiutil attach "$DMG" -mountpoint /tmp/inkflow-mnt -nobrowse -quiet
          ls -la /tmp/inkflow-mnt/
          hdiutil detach /tmp/inkflow-mnt -quiet
          echo "DMG verification OK"
      - uses: actions/upload-artifact@v4
        with:
          name: InkFlow-mac-arm64
          path: release/InkFlow-*-mac-*.dmg

  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx --test tests/electron-startup-contract.test.ts
      - run: npm run package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify packaged server + startup smoke
        shell: pwsh
        run: |
          $server = Get-Content dist-electron/server.cjs -Raw
          # Check for unbundled runtime dependencies
          $extReqs = [regex]::Matches($server, 'require\("([^"]+)"\)') | ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique
          $bad = @($extReqs | Where-Object { $_ -eq 'vite' -or $_ -eq 'express' -or $_ -eq 'tsx' })
          if ($bad.Count -gt 0) {
            Write-Error "server.cjs has bare external requires: $($bad -join ', ')"
            exit 1
          }
          Write-Host "No bad external requires found (total unique requires: $($extReqs.Count))"
          # Verify server boots and responds
          $env:NODE_ENV = "production"
          $env:PORT = "3099"
          $proc = Start-Process -NoNewWindow -PassThru -FilePath "node" -ArgumentList "dist-electron/server.cjs" -RedirectStandardOutput "release/server-stdout.txt" -RedirectStandardError "release/server-stderr.txt"
          Start-Sleep -Seconds 8
          if ($proc.HasExited) {
            Write-Error "Server exited early. stderr:"
            Get-Content release/server-stderr.txt -ErrorAction SilentlyContinue | Write-Host
            exit 1
          }
          try {
            $config = Invoke-RestMethod -Uri "http://localhost:3099/api/config" -TimeoutSec 5
            if (-not $config.hasApiKey) { throw "hasApiKey missing" }
            Write-Host "Server smoke OK: hasApiKey=$($config.hasApiKey) model=$($config.model)"
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }
          # Verify packaged server in zip
          $zip = Get-ChildItem release/InkFlow-*-win-x64.zip | Select-Object -First 1
          Expand-Archive -Path $zip.FullName -DestinationPath release/verify-win-zip -Force
          $packagedServer = Get-Content release/verify-win-zip/resources/app.asar.unpacked/dist-electron/server.cjs -Raw
          $pkgReqs = [regex]::Matches($packagedServer, 'require\("([^"]+)"\)') | ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique
          $pkgBad = @($pkgReqs | Where-Object { $_ -eq 'vite' -or $_ -eq 'express' -or $_ -eq 'tsx' })
          if ($pkgBad.Count -gt 0) {
            Write-Error "packaged server.cjs has bare external requires: $($pkgBad -join ', ')"
            exit 1
          }
          if (-not (Test-Path release/verify-win-zip/resources/app.asar.unpacked/node_modules/better-sqlite3/build/Release/better_sqlite3.node)) {
            Write-Error "better-sqlite3 native binding missing"
            exit 1
          }
          Write-Host "Packaged server verification OK"
      - name: Verify EXE
        shell: pwsh
        run: |
          $exe = Get-ChildItem release/InkFlow-*-win-x64.exe | Select-Object -First 1
          $size = (Get-Item $exe).Length
          Write-Host "EXE: $exe ($size bytes)"
          if ($size -lt 50000000) { Write-Error "EXE too small, build likely failed"; exit 1 }
          Write-Host "EXE verification OK"
          $zip = Get-ChildItem release/InkFlow-*-win-x64.zip | Select-Object -First 1
          if ($zip) { Write-Host "ZIP: $zip ($((Get-Item $zip).Length) bytes)" }
      - uses: actions/upload-artifact@v4
        with:
          name: InkFlow-win-x64
          path: |
            release/InkFlow-*-win-*.exe
            release/InkFlow-*-win-*.zip
